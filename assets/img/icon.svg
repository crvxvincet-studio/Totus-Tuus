<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#241A0F"/>
      <stop offset="100%" stop-color="#14100C"/>
    </radialGradient>
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E2"/>
      <stop offset="35%" stop-color="#F0D078"/>
      <stop offset="70%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8A6214"/>
    </linearGradient>
    <linearGradient id="ebonyMedal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22170C"/>
      <stop offset="100%" stop-color="#100B06"/>
    </linearGradient>
    <linearGradient id="medalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="45%" stop-color="#EFC96A"/>
      <stop offset="100%" stop-color="#A6781E"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro uniforme -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Reasa / Argolla superior de la Medalla Milagrosa -->
  <circle cx="256" cy="74" r="16" fill="none" stroke="url(#rimGold)" stroke-width="8"/>
  <rect x="247" y="81" width="18" height="12" rx="3" fill="url(#rimGold)"/>

  <!-- Marco Ovalado de la Medalla Milagrosa (sin puntos adicionales para que solo destaquen las 12 estrellas) -->
  <ellipse cx="256" cy="266" rx="144" ry="178" fill="url(#rimGold)"/>
  <ellipse cx="256" cy="266" rx="139.5" ry="173.5" fill="none" stroke="#FFF9E2" stroke-width="2" opacity="0.85"/>
  <ellipse cx="256" cy="266" rx="129" ry="163" fill="url(#ebonyMedal)" stroke="#B88928" stroke-width="2.5"/>

  <!-- LAS 12 ESTRELLAS EXACTAS DE 5 PUNTAS (Apocalipsis 12, 1) -->
  <g id="twelve-stars">
    <polygon points="222.9,387.9 225.7,395.3 233.6,395.7 227.4,400.6 229.5,408.2 222.9,403.8 216.4,408.2 218.5,400.6 212.3,395.7 220.2,395.3" fill="url(#medalGold)"/><polygon points="176.5,348.5 179.2,355.9 187.1,356.2 181.0,361.1 183.1,368.7 176.5,364.4 169.9,368.7 172.0,361.1 165.8,356.2 173.7,355.9" fill="url(#medalGold)"/><polygon points="151.3,283.9 154.1,291.3 162.0,291.6 155.8,296.6 157.9,304.2 151.3,299.8 144.8,304.2 146.9,296.6 140.7,291.6 148.6,291.3" fill="url(#medalGold)"/><polygon points="154.2,211.5 157.0,218.9 164.9,219.3 158.7,224.2 160.8,231.8 154.2,227.4 147.7,231.8 149.8,224.2 143.6,219.3 151.5,218.9" fill="url(#medalGold)"/><polygon points="181.7,154.1 184.4,161.5 192.3,161.8 186.1,166.7 188.3,174.4 181.7,170.0 175.1,174.4 177.2,166.7 171.0,161.8 178.9,161.5" fill="url(#medalGold)"/><polygon points="222.9,121.7 225.7,129.0 233.6,129.4 227.4,134.3 229.5,141.9 222.9,137.6 216.4,141.9 218.5,134.3 212.3,129.4 220.2,129.0" fill="url(#medalGold)"/><polygon points="289.1,121.7 291.8,129.0 299.7,129.4 293.5,134.3 295.6,141.9 289.1,137.6 282.5,141.9 284.6,134.3 278.4,129.4 286.3,129.0" fill="url(#medalGold)"/><polygon points="330.3,154.1 333.1,161.5 341.0,161.8 334.8,166.7 336.9,174.4 330.3,170.0 323.7,174.4 325.9,166.7 319.7,161.8 327.6,161.5" fill="url(#medalGold)"/><polygon points="357.8,211.5 360.5,218.9 368.4,219.3 362.2,224.2 364.3,231.8 357.8,227.4 351.2,231.8 353.3,224.2 347.1,219.3 355.0,218.9" fill="url(#medalGold)"/><polygon points="360.7,283.9 363.4,291.3 371.3,291.6 365.1,296.6 367.2,304.2 360.7,299.8 354.1,304.2 356.2,296.6 350.0,291.6 357.9,291.3" fill="url(#medalGold)"/><polygon points="335.5,348.5 338.3,355.9 346.2,356.2 340.0,361.1 342.1,368.7 335.5,364.4 328.9,368.7 331.0,361.1 324.9,356.2 332.8,355.9" fill="url(#medalGold)"/><polygon points="289.1,387.9 291.8,395.3 299.7,395.7 293.5,400.6 295.6,408.2 289.1,403.8 282.5,408.2 284.6,400.6 278.4,395.7 286.3,395.3" fill="url(#medalGold)"/>
  </g>

  <!-- La Cruz Latina sobre el Travesaño Horizontal (la T) y la M entrelazada -->
  <g fill="url(#medalGold)">
    <rect x="246" y="134" width="20" height="110" rx="3.5"/>
    <rect x="206" y="158" width="100" height="19" rx="3.5"/>
    <rect x="182" y="232" width="148" height="15" rx="3.5"/>
    <path d="M 192 328 L 212 220 L 231 220 L 256 280 L 281 220 L 300 220 L 320 328 L 299 328 L 286 252 L 263 305 L 249 305 L 226 252 L 213 328 Z"/>
  </g>

  <!-- Los Dos Sagrados Corazones separados limpiamente de las estrellas inferiores -->
  <g fill="url(#medalGold)">
    <!-- Sagrado Corazón de Jesús (izquierda) -->
    <rect x="230" y="340" width="4" height="11" rx="1"/>
    <rect x="226" y="344" width="12" height="4" rx="1"/>
    <path d="M 232 376 C 232 376 216 365 216 355 C 216 349 221 346 226 349 C 229 351 232 354 232 354 C 232 354 235 351 238 349 C 243 346 248 349 248 355 C 248 365 232 376 232 376 Z"/>
    <!-- Corazón Inmaculado de María (derecha, atravesado por espada) -->
    <path d="M 280 376 C 280 376 264 365 264 355 C 264 349 269 346 274 349 C 277 351 280 354 280 354 C 280 354 283 351 286 349 C 291 346 296 349 296 355 C 296 365 280 376 280 376 Z"/>
    <line x1="262" y1="347" x2="298" y2="371" stroke="url(#medalGold)" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>